<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D9F45C" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Konkai" />
    <title>Konkai · จัดก๊วนแบด</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Critical, inlined so the splash paints correctly before style.css
         is injected (Vite dev serves CSS via JS, which lands a beat late). */
      :root{
        color-scheme:light;
        --paper:#F7F5EC; --ink:#14231A; --ink-soft:#5C6558;
        --lime:#D9F45C; --lime-ink:#16240B;
        --font-display:'Kanit','Noto Sans Thai','Helvetica Neue',Arial,sans-serif;
        --font-body:'Kanit','Noto Sans Thai','Helvetica Neue',Arial,sans-serif;
      }
      html, body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--paper); }
      body{ color:var(--ink); font-family:var(--font-body); }
      .splash{
        position:fixed; inset:0; z-index:9999;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
        background:var(--paper);
        transition:opacity .45s ease;
      }
      .splash.splash-hide{ opacity:0; pointer-events:none; }
      .splash-mark{
        width:76px; height:76px; border-radius:20px;
        overflow:hidden;
        animation:splash-pulse 1.4s ease-in-out infinite;
      }
      .splash-mark img{ width:100%; height:100%; display:block; }
      .splash-word{ font-family:var(--font-display); font-weight:900; font-size:24px; letter-spacing:0.02em; color:var(--ink); }
      .splash-sub{ font-size:13px; color:var(--ink-soft); font-weight:500; }
      @keyframes splash-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
      @media (prefers-reduced-motion: reduce){ .splash-mark{ animation:none; } }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash-mark">
        <img src="/icon.svg" alt="" />
      </div>
      <div class="splash-word">KONKAI</div>
      <div class="splash-sub" id="splash-sub">Setting up your crew…</div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        try {
          if (localStorage.getItem("konkai_locale") === "th") {
            document.getElementById("splash-sub").textContent = "กำลังเตรียมก๊วน…";
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
